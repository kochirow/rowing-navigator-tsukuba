plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// For Google Maps API key
def secretProperties = new Properties()
def secretPropertiesFile = rootProject.file('secret.properties')
if (secretPropertiesFile.exists()) {
    secretPropertiesFile.withReader('UTF-8') { reader ->
        secretProperties.load(reader)
    }
}

// Release signing must never fall back to the shared debug key.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def googleMapsApiKey = secretProperties.getProperty('googleMap.apiKey', '')?.trim()
if (releaseTaskRequested && !googleMapsApiKey) {
    throw new GradleException(
        'Production Google Maps key is not configured. Copy '
        + 'android/secret.properties.sample to android/secret.properties and '
        + 'set googleMap.apiKey to a package-restricted key.'
    )
}
def requiredSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningKeys = requiredSigningKeys.findAll {
    !keystoreProperties.getProperty(it)?.trim()
}
if (releaseTaskRequested &&
        (!keystorePropertiesFile.exists() || !missingSigningKeys.isEmpty())) {
    throw new GradleException(
        'Production signing is not configured. Copy android/key.properties.example '
        + 'to android/key.properties and set the upload keystore values. Missing: '
        + missingSigningKeys.join(', ')
    )
}

// 配布物には必ず Git SHA を入れる。`unknown` のまま配ると、実機ログを読んでも
// どのコードの挙動か確定できない(2026-09-26 のログで実際に起きた)。
// dart-defines は `KEY=VALUE` を base64 にしてカンマで繋いだ文字列。
def dartDefineKeys = (project.findProperty('dart-defines') ?: '')
    .toString()
    .split(',')
    .findAll { it }
    .collect {
        try {
            new String(it.decodeBase64(), 'UTF-8').split('=', 2)[0]
        } catch (IllegalArgumentException ignored) {
            ''
        }
    }
if (releaseTaskRequested && !dartDefineKeys.contains('GIT_COMMIT_SHA')) {
    throw new GradleException(
        'Release builds must embed the Git SHA. Build with '
        + 'tool/flutter_with_provenance.sh build apk --release (or appbundle) '
        + 'instead of calling flutter directly.'
    )
}


android {
    namespace "jp.kosei.rowingnavigator.tsukuba"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && missingSigningKeys.isEmpty()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "jp.kosei.rowingnavigator.tsukuba"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // minSdkVersion flutter.minSdkVersion
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // For Google Maps API key
        manifestPlaceholders += [
            googleMapApiKey: googleMapsApiKey,
        ]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Flutter の Gradle プラグインも proguard-rules.pro を拾うが、
            // Firebase の keep ルールが確実に効くよう明示する。
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
